# 9t — one-command Docker install (alternative to ./setup.sh).
#
#   NINE_T_SETUP_TOKEN=$(openssl rand -hex 16) docker compose up -d --build
#
# Then open http://<host>:3265 and create the administrator in the browser.
# Data persists in the 9t-data volume. The phone event socket shares port 3265,
# so no extra ports or special proxy rules are needed for push.

services:
  9t:
    build: .
    image: 9t:latest
    ports:
      - "${PORT:-3265}:3265"
    environment:
      PORT: "${PORT:-3265}"
      NINE_T_HOST: "0.0.0.0"
      NINE_T_DATA_DIR: "/data"
      NINE_T_BACKUP_DIR: "/data/backups"
      NINE_T_SETUP_TOKEN: "${NINE_T_SETUP_TOKEN:-}"
      NINE_T_HTTPS: "${NINE_T_HTTPS:-false}"
      # Opt-in Postgres (schema target; JSON files remain primary until the
      # repository cutover). URL-encode special chars in the password.
      NINE_T_DATABASE_URL: "${NINE_T_DATABASE_URL:-}"
      # Blob storage: local filesystem by default. For S3-compatible
      # storage, set NINE_T_STORAGE_DRIVER=s3 plus the NINE_T_S3_* vars
      # (see .env.example). Metadata is unchanged, so only new uploads
      # land in the bucket.
      NINE_T_STORAGE_DRIVER: "${NINE_T_STORAGE_DRIVER:-local}"
    volumes:
      - 9t-data:/data
    restart: unless-stopped

  # Optional database for the Postgres migration target (opt-in only).
  # JSON files remain primary until the repository cutover, so the default
  # `docker compose up` does not start this. Enable with:
  #   POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose --profile db up -d --build
  #   docker compose exec 9t npm run migrate
  # (URL-encode special chars if you customize the password.)
  db:
    profiles: ["db"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-9t}"
      POSTGRES_USER: "${POSTGRES_USER:-9t}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - 9t-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-9t}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  9t-data:
  9t-db:
