# 9t.kennyy.tech — public landing + guide (static, no app server)
#
# Install on the production host:
#   sudo cp deploy/nginx/9t-tech.conf /etc/nginx/sites-enabled/9t-tech.conf
#   sudo certbot --nginx -d 9t.kennyy.tech
#   sudo node scripts/publish-site.mjs
#
# Cloudflare: DNS is already proxied (orange cloud). Set SSL/TLS mode to
# "Full (strict)" so the edge validates this origin certificate.
# The app vhost (deploy/nginx/9t.conf) is untouched.

server {
    listen 80;
    listen [::]:80;
    server_name 9t.kennyy.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 9t.kennyy.tech;

    ssl_certificate /etc/letsencrypt/live/9t.kennyy.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9t.kennyy.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/9t-tech;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /9t-mark.svg {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
